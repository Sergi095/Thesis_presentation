name: Test and publish presentation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Rust and browser target
        run: |
          rustup toolchain install 1.94.1 --profile minimal --target wasm32-unknown-unknown --component rustfmt
          rustup default 1.94.1
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r tests/requirements.txt
          npx playwright install --with-deps chromium
      - name: Check Rust and compare published Python model
        run: |
          cargo fmt --manifest-path wasm/Cargo.toml -- --check
          cargo test --locked --manifest-path wasm/Cargo.toml
          python tests/physics_parity.py
      - name: Build static presentation and verify actual WebAssembly
        run: |
          npm run build
          node tests/wasm_parity.mjs
      - name: Test presentation and simulator in the browser
        run: npm test
      - name: Retain test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failures
          path: test-results/
          retention-days: 7
      - name: Upload static site
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: verify-and-build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy tested static site
        id: deployment
        uses: actions/deploy-pages@v4
